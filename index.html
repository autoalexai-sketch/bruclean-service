                "@type": "Question",
                "name": "Ile kosztuje mycie elewacji lub dachu w Krakowie?",
                "acceptedAnswer": {
                    "@type": "Answer",
                    "text": "Cena zależy od metrażu, stopnia zabrudzenia i dostępności obiektu. Każdą wycenę przygotowujemy indywidualnie po bezpłatnych oględzinach lub na podstawie zdjęć i wymiarów przesłanych przez formularz kontaktowy."
                }
            },
            {
                "@type": "Question",
                "name": "Czy działacie tylko w Krakowie, czy też w innych miastach Małopolski?",
                "acceptedAnswer": {
                    "@type": "Answer",
                    "text": "Nasza baza znajduje się w Krakowie, a mobilne ekipy obsługują klientów w promieniu do 100 km, m.in. w Skawinie, Wieliczce, Bochni, Myślenicach, Wadowicach, Tarnowie, Chrzanowie i Olkuszu."
                }
            },
            {
                "@type": "Question",
                "name": "Jak szybko możecie przyjechać na bezpłatną wycenę?",
                "acceptedAnswer": {
                    "@type": "Answer",
                    "text": "Zwykle kontaktujemy się w ciągu 24–48 godzin od zgłoszenia telefonicznego lub przez formularz, aby ustalić termin oględzin i przedstawić kosztorys."
                }
            },
            {
                "@type": "Question",
                "name": "Czy prace wysokościowe są bezpieczne i ubezpieczone?",
                "acceptedAnswer": {
                    "@type": "Answer",
                    "text": "Tak. Nasi pracownicy to certyfikowani alpiniści przemysłowi pracujący zgodnie z zasadami BHP, z pełnym zabezpieczeniem i ubezpieczeniem OC prowadzonej działalności."
                }
            },
            {
                "@type": "Question",
                "name": "Jakie metody czyszczenia stosujecie – piaskowanie czy mycie ciśnieniowe?",
                "acceptedAnswer": {
                    "@type": "Answer",
                    "text": "Metodę dobieramy do rodzaju powierzchni i stopnia zabrudzenia: mycie ciśnieniowe do elewacji i kostki brukowej, piaskowanie do kamienia, cegły i zabytków, a impregnację stosujemy jako zabezpieczenie po czyszczeniu."
